<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    
    <link rel="stylesheet" href="biblioteca.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca</title>
    <link rel="icon" type="image/x-icon" href="casa.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
</head>

<body>
    <h1>Biblioteca</h1>

    <main>
        Cadastre-se!
        <div>
            <h3>Bem-vindo ao site!</h3>
            <img src="https://cbk.com.br/wp-content/uploads/2021/02/dicas-para-organizar-o-acervo-da-biblioteca.png" alt="biblioteca">
            <label for="name">Insira seu nome:</label>
            <input type="text" placeholder="Digite seu nome...">

            <label for="cpf">Insira seu CPF:</label>
            <input type="text" placeholder="000-000-000.00">

            <label for="email">Insira seu e-mail:</label>
            <input type="text" placeholder="Ex.: johndoe350@gmail.com">

            <label for="password">Insira sua senha:</label>
            <input type="password" placeholder="Digite sua senha...">

            <label for="address">Digite seu endereço:</label>
            <input type="text" placeholder="Ex.: João Pereira, 150 - 15723.567">

            <button><a href="#">Confirmar</a></button>
        </div>
    </main>
</body>

</html>
